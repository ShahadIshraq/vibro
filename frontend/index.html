<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibro - Context Switcher</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <!-- Sync status indicator -->
        <div id="sync-status" class="sync-status">
            <svg class="sync-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
            <svg class="sync-checkmark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <div class="sync-content">
                <span class="sync-text" id="sync-text">Synced</span>
                <span class="sync-time" id="sync-time">Just now</span>
            </div>
        </div>

        <!-- Full view context information -->
        <div id="context-view">
            <div id="context-info">
                <h2 id="context-name" contenteditable="false">Select a context</h2>
                <div id="context-details">
                    <!-- Notes Section -->
                    <div class="detail-section" id="notes-section" style="display: none;">
                        <div id="notes-list" class="notes-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom cards for context switching -->
        <div id="context-cards">
            <div id="cards-container"></div>
            <button id="add-context-btn" class="add-btn" title="Add new context">
                <span>+</span>
            </button>
        </div>

    </div>

    <!-- Modal for creating/editing contexts -->
    <div id="context-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Create New Context</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="context-form">
                    <div class="form-group">
                        <label for="context-name-input">Context Name</label>
                        <input type="text" id="context-name-input" placeholder="e.g., Work Project" required>
                    </div>
                    <div class="form-group">
                        <label for="context-color-input">Color Theme</label>
                        <select id="context-color-input">
                            <option value="purple">Purple (Default)</option>
                            <option value="blue">Blue</option>
                            <option value="green">Green</option>
                            <option value="orange">Orange</option>
                            <option value="red">Red</option>
                            <option value="pink">Pink</option>
                            <option value="teal">Teal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="context-description-input">Description (Optional)</label>
                        <textarea id="context-description-input" rows="3" placeholder="Brief description..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
